server {
    listen 80;
    server_name kasirindisiniaja.my.id www.kasirindisiniaja.my.id;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect ke HTTPS (setelah certbot jalan)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kasirindisiniaja.my.id www.kasirindisiniaja.my.id;

    # SSL (Certbot auto-inject)
    ssl_certificate /etc/letsencrypt/live/kasirindisiniaja.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasirindisiniaja.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upload size (foto produk)
    client_max_body_size 10m;

    # Static frontend
    location /assets/ {
        root /var/www/kasir/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.svg {
        root /var/www/kasir/frontend/dist;
    }

    # API + SPA fallback ke backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
